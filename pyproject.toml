[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operation-manual-generator"
version = "0.1.0"
description = "AI-assisted user operation manual generator"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0.41,<3",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pyyaml>=6,<7",
  "playwright>=1.54,<2",
  "python-docx>=1.2,<2",
  "pillow>=11.3,<12",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "asgi-lifespan>=2.1,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/manual_generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]
